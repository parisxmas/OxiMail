# Score table for our local symbols. Rspamd reads files in
# local.d/ and merges them into the baseline. We define the AV
# group here so the OXIMAIL_AV_VIRUS symbol carries a 99-point
# score, which exceeds the default 15-point reject threshold and
# triggers an immediate SMTP-time rejection at the inbound MX.
group "antivirus" {
  symbols {
    OXIMAIL_AV_VIRUS {
      score       = 99.0;
      description = "Antivirus daemon (avd) returned a signature match";
    }
  }
}
