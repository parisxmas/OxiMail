# Rspamd antivirus module — points at the OxiMail avd sidecar via a
# shared Unix socket on the compose-private `avd-socket` volume.
#
# avd speaks the clamd wire protocol (PING / INSTREAM / SCAN / etc.)
# so we identify as `type = "clamav"` and rspamd dials it like a
# real clamd. The socket path is the same inside both containers —
# the volume mounts at /run/avd in each.
#
# Match → action: any virus hit raises the OXIMAIL_AV_VIRUS symbol
# with score 99 (well above the 15-point reject threshold), and the
# explicit `action = "reject"` keeps the verdict immediate even if
# the score table is later relaxed.

clamav {
  servers           = "/run/avd/avd.sock";
  # Scan everything — text + image MIME parts included. The
  # rspamd default skips those for CPU reasons on high-volume
  # gateways; a personal mailbox's traffic doesn't need that
  # tradeoff, and EICAR-shaped probes (and any text-encoded
  # exploit payload like a malicious .vbs or .ps1 inlined into
  # the body) only catch when text/* parts get scanned too.
  scan_mime_parts   = true;
  scan_text_mime    = true;
  scan_image_mime   = true;
  log_clean         = true;
  retransmits       = 1;
  cache_expire      = 86400;
  symbol            = "OXIMAIL_AV_VIRUS";
  type              = "clamav";
  action            = "reject";
  message           = '${SCANNER}: virus found: "${VIRUS}"';
}
