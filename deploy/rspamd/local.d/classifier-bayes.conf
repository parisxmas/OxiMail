# Bayes statistical classifier. Requires a redis backend to hold
# the per-token spam/ham counts. We don't run redis, so the
# classifier has nothing to read or write — every per-message
# classify call already logs "call to redis failed: attempt to
# call a nil value" and skips. Disable explicitly to drop the
# token-extraction work from each scan and shed the classifier's
# bookkeeping memory.
enabled = false;
