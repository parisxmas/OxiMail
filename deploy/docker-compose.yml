# OxiMail + OxiDB, side by side on the same network.
#
# Run from the OxiMail repo root:
#   docker compose -f deploy/docker-compose.yml up -d
#
# What this gives you:
#   - OxiDB at the internal hostname `oxidb` (port 4444, not exposed
#     to the host — only oximail reaches it).
#   - OxiMail listening on the host's 25/80/143/465/587/993/8080/9090.
#   - Two named volumes — `oximail-acme` for the ACME cert cache so
#     renewals survive container restarts, `oxidb-data` for the data
#     directory.
#
# Required env (.env file next to this compose file, or `-e ...`):
#   OXIMAIL_HOSTNAME=mail.example.com        # the FQDN the world sees
#   OXIMAIL_ACME_HOSTS=mail.example.com      # comma-separated for SAN
#   OXIMAIL_ACME_EMAIL=ops@example.com       # Let's Encrypt contact
#   OXIMAIL_SRS_SECRET=<openssl rand -hex 32>
#
# Optional (sensible defaults exist for everything else, see README).

services:
  oxidb:
    # Builds the OxiDB image from the upstream Dockerfile, pulled
    # straight from GitHub so no sibling checkout is required.
    build:
      context: https://github.com/parisxmas/OxiDB.git#master
    container_name: oximail-oxidb
    restart: unless-stopped
    environment:
      - OXIDB_ADDR=0.0.0.0:4444
      - OXIDB_DATA=/data
      - OXIDB_POOL_SIZE=64
    volumes:
      - oxidb-data:/data
    networks:
      - oximail
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/4444 || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 12

  avd:
    # OxiMail antivirus daemon. Speaks the clamd wire protocol on a
    # Unix socket; rspamd's `clamav` module dials it directly (see
    # deploy/rspamd/local.d/antivirus.conf). Ships with the EICAR
    # test signature out of the box so end-to-end probes pass on a
    # fresh deploy; mount additional --hdb / --cvd / --ndb / --yara
    # via the OXIMAIL_AV_EXTRA_ARGS env var to grow the detection
    # set without rebuilding the image.
    #
    # Build context is a sibling clone of the antivirus repo on
    # the deploy host — by convention /opt/antivirus next to
    # /opt/oximail. Move them together when relocating.
    build:
      context: ../../antivirus
    container_name: oximail-avd
    restart: unless-stopped
    environment:
      - OXIMAIL_AV_EXTRA_ARGS=${OXIMAIL_AV_EXTRA_ARGS:-}
      - RUST_LOG=${OXIMAIL_AV_LOG:-info}
    volumes:
      # Shared socket dir. Both avd (writer) and rspamd (reader)
      # mount this volume at /run/avd; avd creates avd.sock there
      # with umask 000 so the rspamd uid can dial it.
      - avd-socket:/run/avd
    networks:
      - oximail
    healthcheck:
      # `test -S` succeeds iff the path exists and is a Unix socket.
      # avd creates the socket as the first thing it does after the
      # signature load, so this also gates "signatures are loaded".
      # A protocol-level PING probe would be richer but needs nc /
      # socat in the runtime image, which we'd rather not ship.
      test: ["CMD-SHELL", "test -S /run/avd/avd.sock"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 4s

  rspamd:
    # Content scanner. Empty OXIMAIL_RSPAMD_URL on the oximail side
    # disables the integration, so this sidecar is opt-in at the
    # url level — but defaulting both the container AND the url
    # makes a fresh deploy spam-aware out of the box.
    #
    # The default config is permissive (no DKIM/SPF rejects, no
    # bayes training out of the box) — we lean on Rspamd's mime
    # heuristics, fuzzy, surbl, and phishing modules to flag
    # obvious malware attachments and known-bad URLs.
    image: rspamd/rspamd:latest
    container_name: oximail-rspamd
    restart: unless-stopped
    depends_on:
      avd:
        # Wait for the AV daemon to be ready so the first
        # /checkv2 call doesn't surface a connection-refused on
        # the clamav backend. Rspamd handles per-call retries, but
        # a clean startup keeps the logs quiet.
        condition: service_healthy
    networks:
      - oximail
    volumes:
      # Persist learned bayes + history + neural data across
      # container restarts. Without this, every restart wipes the
      # adaptive parts and quality slowly degrades.
      - rspamd-data:/var/lib/rspamd
      # Shared AV socket — same volume avd publishes on. Read-only
      # from rspamd's side: it dials but doesn't create anything.
      - avd-socket:/run/avd:ro
      # Antivirus module config + symbol score table. Mounted into
      # local.d/ so the upstream rspamd image picks them up alongside
      # the baseline defaults without us shipping a fork or a
      # custom image.
      - ./rspamd/local.d/antivirus.conf:/etc/rspamd/local.d/antivirus.conf:ro
      - ./rspamd/local.d/groups.conf:/etc/rspamd/local.d/groups.conf:ro
    healthcheck:
      # Use bash explicitly: the Debian slim base ships dash as
      # /bin/sh and dash has no /dev/tcp builtin. 11334 is the
      # controller worker; rspamd boots it after the main
      # /checkv2 worker, so this also gates "ready to accept
      # scans" reasonably well.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/11334"]
      interval: 10s
      timeout: 3s
      retries: 6

  oximail:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: oximail
    restart: unless-stopped
    depends_on:
      oxidb:
        condition: service_healthy
      rspamd:
        # Not strictly required — the spam.New pipeline fails open
        # when Rspamd is unreachable — but waiting for healthy
        # avoids a few seconds of "every message bypasses the
        # filter" right after a cold start.
        condition: service_healthy
    environment:
      # Server identity + storage wiring.
      - OXIMAIL_HOSTNAME=${OXIMAIL_HOSTNAME}
      - OXIMAIL_OXIDB_HOST=oxidb
      - OXIMAIL_OXIDB_PORT=4444
      # ACME on by default. Replace with OXIMAIL_TLS_CERT / _KEY if
      # you're running behind a TLS-terminating proxy or using your
      # own certbot.
      - OXIMAIL_ACME_HOSTS=${OXIMAIL_ACME_HOSTS:-}
      - OXIMAIL_ACME_EMAIL=${OXIMAIL_ACME_EMAIL:-}
      - OXIMAIL_ACME_CACHE=/var/lib/oximail/acme-cache
      # Alias-forwarding key. Without it, aliases that point at
      # remote addresses are refused with 550.
      - OXIMAIL_SRS_SECRET=${OXIMAIL_SRS_SECRET:-}
      # Publish an MTA-STS policy so other senders enforce TLS to us.
      - OXIMAIL_MTASTS_MODE=${OXIMAIL_MTASTS_MODE:-enforce}
      - OXIMAIL_MTASTS_MX=${OXIMAIL_MTASTS_MX:-${OXIMAIL_HOSTNAME}}
      # Logs as JSON for log aggregators; switch to "text" for tail-friendly.
      - OXIMAIL_LOG_FORMAT=${OXIMAIL_LOG_FORMAT:-json}
      - OXIMAIL_LOG_LEVEL=${OXIMAIL_LOG_LEVEL:-info}
      # Spam-pipeline knobs. Empty OXIMAIL_DNSBL_ZONES disables DNSBL;
      # 0 OXIMAIL_GREYLIST_DELAY disables greylisting.
      - OXIMAIL_DNSBL_ZONES=${OXIMAIL_DNSBL_ZONES-zen.spamhaus.org}
      - OXIMAIL_GREYLIST_DELAY=${OXIMAIL_GREYLIST_DELAY:-1m}
      # Content scanner. The rspamd sidecar above is started
      # automatically; OXIMAIL_RSPAMD_URL=http://rspamd:11333
      # wires the inbound spam pipeline to it. Set this to empty
      # in your .env to disable scanning entirely.
      - OXIMAIL_RSPAMD_URL=${OXIMAIL_RSPAMD_URL-http://rspamd:11333}
      # Outbound AV: oximail dials the avd sidecar over a Unix
      # socket to scan webmail compose attachments before relay.
      # Empty value disables the integration (mail goes out
      # unscanned). The default below assumes the avd sidecar
      # is present per deploy/docker-compose.yml.
      - OXIMAIL_AV_SOCKET=${OXIMAIL_AV_SOCKET-/run/avd/avd.sock}
      # When true, an unreachable / broken avd causes outbound
      # webmail sends to fail with a 502; when false (default),
      # avd outages log a warning but mail still goes out. The
      # tradeoff is "block legit sends during an outage" vs
      # "accept the rare moment a virus slips through during a
      # 30-second avd restart". Default leans on Phase A
      # (rspamd) as the catch-net on the receiver's side too.
      - OXIMAIL_AV_REQUIRED=${OXIMAIL_AV_REQUIRED-false}
    ports:
      - "25:25"        # SMTP MX (inbound)
      - "465:465"      # SMTPS submission
      - "587:587"      # Submission STARTTLS
      - "143:143"      # IMAP STARTTLS
      - "993:993"      # IMAPS
      - "80:80"        # ACME HTTP-01 challenge
      - "8080:8080"    # Webmail HTTP+JSON API + SPA
      - "9090:9090"    # /metrics, /healthz, /readyz
    volumes:
      - oximail-acme:/var/lib/oximail/acme-cache
      # AV daemon socket — read-only mount from the shared
      # avd-socket volume. internal/av in oximail dials
      # /run/avd/avd.sock to scan outbound webmail attachments
      # before they leave the host. Rspamd (Phase A) handles
      # inbound; this is the symmetric outbound guard.
      - avd-socket:/run/avd:ro
    networks:
      - oximail

volumes:
  oxidb-data:
  oximail-acme:
  rspamd-data:
  # tmpfs-style volume shared between avd (creator) and rspamd
  # (consumer) for the AV daemon's Unix socket. Lives only on
  # the docker host's filesystem; nothing on it survives a
  # `docker compose down -v`, which is fine because the socket
  # is recreated at avd startup.
  avd-socket:

networks:
  oximail:
    driver: bridge
