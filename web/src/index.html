<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OxiMail</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)" />

    <!-- Type system — Roboto. Same family Gmail uses for body and UI
         chrome; the system fallbacks in --font-ui keep the surface
         legible if the network round-trip fails. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <oximail-root></oximail-root>
  </body>
</html>
